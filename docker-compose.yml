services:
  ignite:
    image: apacheignite/ignite:3.1.0
    container_name: energy-ignite
    command:
      --node-name energy-ignite
    ports:
      - "10300:10300"
      - "10800:10800"
    volumes:
      - ignite_data:/opt/ignite/work
    restart: unless-stopped
  kafka:
    image: apache/kafka:latest
    container_name: energy-kafka
    ports:
      - "9092:9092"
    restart: unless-stopped
  postgres:
    image: postgres:18
    container_name: energy-postgres
    environment:
      POSTGRES_DB: energy_monitor
      POSTGRES_USER: energy_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  ignite_data:
  postgres18_data: