spring.application.name=energy-monitor

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.voltwise.energy_monitor.reader,com.voltwise.energy_monitor.dto
spring.kafka.consumer.properties[spring.json.use.type.headers]=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.ignite.address=${IGNITE_ADDRESS}

app.tariff.normal=${NORMAL_TARIFF_RATE}
app.tariff.penalty=${PENALTY_TARIFF_RATE}
app.snapshot.rate=${SNAPSHOT_RATE_MS}

app.kafka.registration-topic=${REGISTRATION_TOPIC}