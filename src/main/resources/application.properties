spring.application.name=energy-monitor
spring.datasource.url=jdbc:postgresql://localhost:5432/energy_monitor
spring.datasource.username=energy_app
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.voltwise.energy_monitor.reader
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=com.voltwise.energy_monitor.reader.ApplianceReading

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.ignite.address=${IGNITE_ADDRESS}

app.tariff.normal=${NORMAL_TARIFF_RATE}
app.tariff.penalty=${PENALTY_TARIFF_RATE}
app.snapshot.rate=${SNAPSHOT_RATE_MS}